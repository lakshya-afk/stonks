<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tradient Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script>
      tailwind.config = {
        darkMode: 'class'
      }
    </script>
</head>
<body class="bg-black text-gray-100">
    <!-- Top Bar: Menu Icon Left, Company Name Center, Bell & User Right -->
    <div class="w-full flex items-center justify-between px-8 py-6">
        <div class="flex items-center flex-1">
            <button id="sidebar-toggle" class="focus:outline-none flex flex-col justify-center items-center">
                <span class="block w-6 h-0.5 bg-blue-400 mb-1"></span>
                <span class="block w-6 h-0.5 bg-blue-400 mb-1"></span>
                <span class="block w-6 h-0.5 bg-blue-400"></span>
            </button>
        </div>
        <div class="flex-1 flex justify-center">
            <span class="text-3xl font-bold text-blue-500">Tradient</span>
        </div>
        <div class="flex items-center space-x-6 flex-1 justify-end">
            <div class="notification relative">
                <i class="fas fa-bell text-blue-300 text-xl"></i>
                <span class="absolute -top-1 -right-1 bg-red-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-xs">3</span>
            </div>
            <div class="user-profile flex items-center">
                <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="User" class="w-8 h-8 rounded-full border-2 border-blue-700">
                <span class="ml-2 font-medium text-gray-100">John Doe</span>
            </div>
        </div>
    </div>
    <div class="flex h-[calc(100vh-4.5rem)] overflow-hidden">
        <!-- Sidebar -->
        <div id="sidebar" class="sidebar w-64 bg-black shadow-lg flex flex-col transition-all duration-300 ease-in-out">
            <!-- Removed menu icon and company name from sidebar -->
            <nav class="flex-1 mt-4">
                <ul class="space-y-1 mt-2">
                    <li>
                        <a href="#" id="dashboard-link" class="flex items-center px-6 py-3 rounded-lg text-blue-400 bg-blue-950 font-semibold transition hover:bg-blue-900 active:bg-blue-800">
                            <i class="fas fa-home text-lg"></i>
                            <span class="ml-3 sidebar-label transition-all duration-300">Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" id="stocks-link" class="flex items-center px-6 py-3 rounded-lg text-gray-200 hover:text-blue-400 hover:bg-blue-950 transition">
                            <i class="fas fa-chart-line text-lg"></i>
                            <span class="ml-3 sidebar-label transition-all duration-300">Stocks</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="flex items-center px-6 py-3 rounded-lg text-gray-200 hover:text-blue-400 hover:bg-blue-950 transition">
                            <i class="fas fa-wallet text-lg"></i>
                            <span class="ml-3 sidebar-label transition-all duration-300">My Portfolio</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="flex items-center px-6 py-3 rounded-lg text-gray-200 hover:text-blue-400 hover:bg-blue-950 transition">
                            <i class="fas fa-cog text-lg"></i>
                            <span class="ml-3 sidebar-label transition-all duration-300">Settings</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="flex-1 overflow-auto">
            <!-- Header -->
            <!-- Removed header bar, as top bar is now above -->
            <!-- Dashboard Content -->
            <main class="p-6" id="main-content">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6" id="dashboard-tiles">
                    <!-- Total Investment Tile -->
                    <div class="bg-black rounded-xl shadow-sm p-6 backdrop-blur-md bg-white/10 border border-white/20">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-blue-300">Total Investment</p>
                                <h2 class="text-2xl font-bold mt-1 text-gray-100" id="total-investment">₹1,25,000</h2>
                            </div>
                            <div class="bg-blue-900 text-blue-400 px-3 py-1 rounded-full text-sm">
                                +12.5%
                            </div>
                        </div>
                        <div class="mt-4">
                            <div class="h-2 bg-blue-950 rounded-full">
                                <div class="h-2 bg-blue-500 rounded-full" style="width: 75%"></div>
                            </div>
                            <p class="text-blue-300 text-sm mt-2">75% of your goal</p>
                        </div>
                    </div>
                    <!-- Current Value Tile -->
                    <div class="bg-black rounded-xl shadow-sm p-6 backdrop-blur-md bg-white/10 border border-white/20">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-blue-300">Current Value</p>
                                <h2 class="text-2xl font-bold mt-1 text-gray-100" id="current-value">₹1,42,500</h2>
                            </div>
                            <div class="bg-blue-900 text-blue-400 px-3 py-1 rounded-full text-sm">
                                +17.5%
                            </div>
                        </div>
                        <div class="mt-4">
                            <div class="h-2 bg-blue-950 rounded-full">
                                <div class="h-2 bg-blue-700 rounded-full" style="width: 85%"></div>
                            </div>
                            <p class="text-blue-300 text-sm mt-2">85% of your goal</p>
                        </div>
                    </div>
                    <!-- Returns Tile -->
                    <div class="bg-black rounded-xl shadow-sm p-6 backdrop-blur-md bg-white/10 border border-white/20">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-blue-300">Returns</p>
                                <h2 class="text-2xl font-bold mt-1 text-gray-100" id="returns">₹17,500</h2>
                            </div>
                            <div class="bg-blue-900 text-blue-400 px-3 py-1 rounded-full text-sm">
                                +5.2%
                            </div>
                        </div>
                        <div class="mt-4">
                            <div class="h-2 bg-blue-950 rounded-full">
                                <div class="h-2 bg-purple-500 rounded-full" style="width: 65%"></div>
                            </div>
                            <p class="text-blue-300 text-sm mt-2">65% of your goal</p>
                        </div>
                    </div>
                </div>
                <!-- Investment Breakdown Tile -->
                <div class="rounded-xl shadow-sm p-6 mb-0 flex flex-col flex-grow backdrop-blur-md bg-white/10 border border-white/20 transition-all duration-500" style="min-height: 22rem;" id="breakdown-tile">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold text-gray-100 transition-all duration-500">Investment Breakdown</h2>
                    </div>
                    <div class="flex-1 flex items-center justify-center transition-all duration-500">
                        <div id="chart-container" class="w-full h-full transition-all duration-500"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script>
    // filepath: c:\Users\MSI\OneDrive - Manipal University Jaipur\Codes\Tradient\index.html
    // Update dashboard using Zerodha API key

    document.addEventListener("DOMContentLoaded", function () {
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('sidebar-toggle');
        const sidebarLabels = document.querySelectorAll('.sidebar-label');
        const sidebarTitle = document.querySelector('.sidebar-title');

        let collapsed = false;
        toggleBtn.addEventListener('click', function () {
            collapsed = !collapsed;
            if (collapsed) {
                sidebar.classList.remove('w-64');
                sidebar.classList.add('w-20');
                sidebarLabels.forEach(l => {
                    l.classList.add('opacity-0', 'w-0');
                });
            } else {
                sidebar.classList.remove('w-20');
                sidebar.classList.add('w-64');
                sidebarLabels.forEach(l => {
                    l.classList.remove('opacity-0', 'w-0');
                });
            }
        });

        // Zerodha API integration for dashboard
        const apiKey = "fz9fvx286a737kia";
        const endpoint = "https://api.zerodha.com/portfolio/summary";

        fetch(endpoint, {
            headers: {
                "Authorization": `Bearer ${apiKey}`
            }
        })
        .then(res => res.json())
        .then(data => {
            // Example expected response:
            // {
            //   totalInvestment: 125000,
            //   currentValue: 142500,
            //   returns: 17500,
            //   stocks: 44,
            //   mutualFunds: 33,
            //   gold: 23
            // }

            // Update Portfolio Summary
            document.querySelectorAll('.grid .bg-black')[0].querySelector('h2').textContent = `₹${data.totalInvestment?.toLocaleString() || '0'}`;
            document.querySelectorAll('.grid .bg-black')[1].querySelector('h2').textContent = `₹${data.currentValue?.toLocaleString() || '0'}`;
            document.querySelectorAll('.grid .bg-black')[2].querySelector('h2').textContent = `₹${data.returns?.toLocaleString() || '0'}`;

            // Pie chart in Investment Breakdown
            var options = {
                chart: {
                    type: 'pie',
                    height: 320,
                    background: 'transparent',
                    animations: {
                        enabled: true,
                        easing: 'easeinout',
                        speed: 800,
                        animateGradually: { enabled: true, delay: 150 },
                        dynamicAnimation: { enabled: true, speed: 350 }
                    }
                },
                series: [
                    data.stocks || 0,
                    data.mutualFunds || 0,
                    data.gold || 0
                ],
                labels: ['Stocks', 'Mutual Funds', 'Gold'],
                colors: ['#3b82f6', '#2563eb', '#a855f7'],
                legend: {
                    position: 'bottom',
                    labels: {
                        colors: ['#e0e7ef', '#e0e7ef', '#e0e7ef']
                    }
                },
                dataLabels: {
                    style: {
                        colors: ['#e0e7ef']
                    }
                },
                stroke: {
                    show: false
                }
            };
            var chart = new ApexCharts(document.querySelector("#chart-container"), options);
            chart.render();
        })
        .catch(() => {
            // fallback to static data if API fails
            var options = {
                chart: {
                    type: 'pie',
                    height: 320,
                    background: 'transparent',
                    animations: {
                        enabled: true,
                        easing: 'easeinout',
                        speed: 800,
                        animateGradually: { enabled: true, delay: 150 },
                        dynamicAnimation: { enabled: true, speed: 350 }
                    }
                },
                series: [44, 33, 23],
                labels: ['Stocks', 'Mutual Funds', 'Gold'],
                colors: ['#3b82f6', '#2563eb', '#a855f7'],
                legend: {
                    position: 'bottom',
                    labels: {
                        colors: ['#e0e7ef', '#e0e7ef', '#e0e7ef']
                    }
                },
                dataLabels: {
                    style: {
                        colors: ['#e0e7ef']
                    }
                },
                stroke: {
                    show: false
                }
            };
            var chart = new ApexCharts(document.querySelector("#chart-container"), options);
            chart.render();
        });

        // Dashboard page logic
        document.getElementById('dashboard-link').addEventListener('click', function (e) {
            e.preventDefault();
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6" id="dashboard-tiles">
                    <div class="bg-black rounded-xl shadow-sm p-6 backdrop-blur-md bg-white/10 border border-white/20">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-blue-300">Total Investment</p>
                                <h2 class="text-2xl font-bold mt-1 text-gray-100" id="total-investment">₹1,25,000</h2>
                            </div>
                            <div class="bg-blue-900 text-blue-400 px-3 py-1 rounded-full text-sm">
                                +12.5%
                            </div>
                        </div>
                        <div class="mt-4">
                            <div class="h-2 bg-blue-950 rounded-full">
                                <div class="h-2 bg-blue-500 rounded-full" style="width: 75%"></div>
                            </div>
                            <p class="text-blue-300 text-sm mt-2">75% of your goal</p>
                        </div>
                    </div>
                    <div class="bg-black rounded-xl shadow-sm p-6 backdrop-blur-md bg-white/10 border border-white/20">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-blue-300">Current Value</p>
                                <h2 class="text-2xl font-bold mt-1 text-gray-100" id="current-value">₹1,42,500</h2>
                            </div>
                            <div class="bg-blue-900 text-blue-400 px-3 py-1 rounded-full text-sm">
                                +17.5%
                            </div>
                        </div>
                        <div class="mt-4">
                            <div class="h-2 bg-blue-950 rounded-full">
                                <div class="h-2 bg-blue-700 rounded-full" style="width: 85%"></div>
                            </div>
                            <p class="text-blue-300 text-sm mt-2">85% of your goal</p>
                        </div>
                    </div>
                    <div class="bg-black rounded-xl shadow-sm p-6 backdrop-blur-md bg-white/10 border border-white/20">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-blue-300">Returns</p>
                                <h2 class="text-2xl font-bold mt-1 text-gray-100" id="returns">₹17,500</h2>
                            </div>
                            <div class="bg-blue-900 text-blue-400 px-3 py-1 rounded-full text-sm">
                                +5.2%
                            </div>
                        </div>
                        <div class="mt-4">
                            <div class="h-2 bg-blue-950 rounded-full">
                                <div class="h-2 bg-purple-500 rounded-full" style="width: 65%"></div>
                            </div>
                            <p class="text-blue-300 text-sm mt-2">65% of your goal</p>
                        </div>
                    </div>
                </div>
                <div class="rounded-xl shadow-sm p-6 mb-0 flex flex-col flex-grow backdrop-blur-md bg-white/10 border border-white/20 transition-all duration-500" style="min-height: 22rem;" id="breakdown-tile">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold text-gray-100 transition-all duration-500">Investment Breakdown</h2>
                    </div>
                    <div class="flex-1 flex items-center justify-center transition-all duration-500">
                        <div id="chart-container" class="w-full h-full transition-all duration-500"></div>
                    </div>
                </div>
            `;
            // Re-render dashboard data and chart
            fetch("https://api.zerodha.com/portfolio/summary", {
                headers: {
                    "Authorization": `Bearer fz9fvx286a737kia`
                }
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('total-investment').textContent = `₹${data.totalInvestment?.toLocaleString() || '0'}`;
                document.getElementById('current-value').textContent = `₹${data.currentValue?.toLocaleString() || '0'}`;
                document.getElementById('returns').textContent = `₹${data.returns?.toLocaleString() || '0'}`;
                var options = {
                    chart: {
                        type: 'pie',
                        height: 320,
                        background: 'transparent',
                        animations: {
                            enabled: true,
                            easing: 'easeinout',
                            speed: 800,
                            animateGradually: { enabled: true, delay: 150 },
                            dynamicAnimation: { enabled: true, speed: 350 }
                        }
                    },
                    series: [
                        data.stocks || 0,
                        data.mutualFunds || 0,
                        data.gold || 0
                    ],
                    labels: ['Stocks', 'Mutual Funds', 'Gold'],
                    colors: ['#3b82f6', '#2563eb', '#a855f7'],
                    legend: {
                        position: 'bottom',
                        labels: {
                            colors: ['#e0e7ef', '#e0e7ef', '#e0e7ef']
                        }
                    },
                    dataLabels: {
                        style: {
                            colors: ['#e0e7ef']
                        }
                    },
                    stroke: {
                        show: false
                    }
                };
                var chart = new ApexCharts(document.querySelector("#chart-container"), options);
                chart.render();
            })
            .catch(() => {
                var options = {
                    chart: {
                        type: 'pie',
                        height: 320,
                        background: 'transparent',
                        animations: {
                            enabled: true,
                            easing: 'easeinout',
                            speed: 800,
                            animateGradually: { enabled: true, delay: 150 },
                            dynamicAnimation: { enabled: true, speed: 350 }
                        }
                    },
                    series: [44, 33, 23],
                    labels: ['Stocks', 'Mutual Funds', 'Gold'],
                    colors: ['#3b82f6', '#2563eb', '#a855f7'],
                    legend: {
                        position: 'bottom',
                        labels: {
                            colors: ['#e0e7ef', '#e0e7ef', '#e0e7ef']
                        }
                    },
                    dataLabels: {
                        style: {
                            colors: ['#e0e7ef']
                        }
                    },
                    stroke: {
                        show: false
                    }
                };
                var chart = new ApexCharts(document.querySelector("#chart-container"), options);
                chart.render();
            });
        });

        // Stocks page logic with RapidAPI
        document.getElementById('stocks-link').addEventListener('click', function (e) {
            e.preventDefault();
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = `
                <div class="rounded-xl shadow-sm p-6 mb-6 backdrop-blur-md bg-white/10 border border-white/20 transition-all duration-500">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-gray-100">Stocks</h2>
                        <div class="relative w-72">
                            <input id="stock-search" type="text" placeholder="Search stocks..." class="pl-10 pr-4 py-2 rounded-lg border border-blue-700 bg-black text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent w-full placeholder-blue-300 transition-all duration-300">
                            <i class="fas fa-search absolute left-3 top-3 text-blue-300"></i>
                        </div>
                    </div>
                    <div id="stocks-table-container" class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-700">
                            <thead>
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-blue-300 uppercase tracking-wider">Period</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-blue-300 uppercase tracking-wider">Net Income</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-blue-300 uppercase tracking-wider">Operating Cash Flow</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-blue-300 uppercase tracking-wider">Investing Cash Flow</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-blue-300 uppercase tracking-wider">Financing Cash Flow</th>
                                </tr>
                            </thead>
                            <tbody id="stocks-table-body" class="bg-black divide-y divide-gray-800"></tbody>
                        </table>
                    </div>
                </div>
            `;

            fetch('https://real-time-finance-data.p.rapidapi.com/company-cash-flow?symbol=AAPL%3ANASDAQ&period=QUARTERLY&language=en', {
                method: 'GET',
                headers: {
                    'x-rapidapi-key': 'e6d0b7139cmshd84dcf05d619fd3p12b3b7jsn27789fcdd8c8',
                    'x-rapidapi-host': 'real-time-finance-data.p.rapidapi.com'
                }
            })
            .then(response => response.json())
            .then(data => {
                // Adapt to API response structure
                // Example: data.data.cashFlowStatements is an array
                const tbody = document.getElementById('stocks-table-body');
                const statements = data?.data?.cashFlowStatements || [];
                let filteredStatements = statements;

                // Search filter logic
                const searchInput = document.getElementById('stock-search');
                searchInput.addEventListener('input', function () {
                    const query = this.value.toLowerCase();
                    filteredStatements = statements.filter(row =>
                        (row.period || '').toLowerCase().includes(query) ||
                        (row.netIncome || '').toString().toLowerCase().includes(query) ||
                        (row.operatingCashFlow || '').toString().toLowerCase().includes(query) ||
                        (row.investingCashFlow || '').toString().toLowerCase().includes(query) ||
                        (row.financingCashFlow || '').toString().toLowerCase().includes(query)
                    );
                    renderTable(filteredStatements);
                });

                function renderTable(rows) {
                    if (Array.isArray(rows) && rows.length > 0) {
                        tbody.innerHTML = rows.map(row => `
                            <tr>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-100">${row.period || '-'}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-100">${row.netIncome || '-'}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-100">${row.operatingCashFlow || '-'}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-100">${row.investingCashFlow || '-'}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-100">${row.financingCashFlow || '-'}</td>
                            </tr>
                        `).join('');
                    } else {
                        tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-gray-400">No stock data available.</td></tr>`;
                    }
                }

                renderTable(filteredStatements);
            })
            .catch(() => {
                const tbody = document.getElementById('stocks-table-body');
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-gray-400">Failed to load stock data.</td></tr>`;
            });
        });
    });
    </script>
    <script src="script.js"></script>
</body>
</html>
